[package]
name = "ferry-sync-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-materialize = { path = "../ferry-materialize" }
ferry-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true

# testutil::set_dir_mtime stamps directory mtimes; std cannot open
# directory handles for time writes on Windows (SetFileTime needs
# FILE_FLAG_BACKUP_SEMANTICS), so the windows branch goes through
# filetime — same approach as ferry-store's and ferry-materialize's
# fixtures (T-17 lineage).
[target.'cfg(not(unix))'.dev-dependencies]
filetime.workspace = true

[lints]
workspace = true
