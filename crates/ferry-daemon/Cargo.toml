[package]
name = "ferry-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-sync = { path = "../ferry-sync" }
ferry-iroh = { path = "../ferry-iroh" }
ferry-crypto = { path = "../ferry-crypto" }
ferry-store = { path = "../ferry-store" }
ferry-folder = { workspace = true }
ferry-ignore = { path = "../ferry-ignore" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
ferry-ipc = { path = "../ferry-ipc" }
ferry-scan = { path = "../ferry-scan" }
ferry-platform.workspace = true
notify = "8"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
zeroize.workspace = true
toml = "0.8"
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
axum = { workspace = true, optional = true }
percent-encoding.workspace = true
qrcode.workspace = true

[features]
default = ["web-ui"]
web-ui = ["dep:axum", "dep:tokio-stream"]
lean = []

[lib]
name = "ferry_daemon"
path = "src/lib.rs"

[[bin]]
name = "ferry-sync"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
axum = { workspace = true }
ferry-folder = { path = "../ferry-folder", features = ["test-util"] }
ferry-ipc = { path = "../ferry-ipc", features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[lints]
workspace = true
