[package]
name = "ferry-pin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-platform.workspace = true
ferry-materialize = { path = "../ferry-materialize" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ignore.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
ferry-store = { path = "../ferry-store", features = ["test-util"] }
tempfile.workspace = true
rand.workspace = true

[lints]
workspace = true
