[package]
name = "ferry-pin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pin-path glob matching uses the same gitignore engine as ferry-ignore so
# `--paths` behaves exactly like the rules users already know.
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
# pid liveness (kill(pid, 0)) for stale-pin detection.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# pid liveness (OpenProcess + GetExitCodeProcess) for stale-pin detection;
# windows-sys is the MIT/Apache-2.0 raw-binding crate used across the
# windows rust ecosystem.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
