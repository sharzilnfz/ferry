[package]
name = "ferry-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-sync = { path = "../ferry-sync" }
ferry-crypto = { path = "../ferry-crypto" }
ferry-store = { path = "../ferry-store" }
blake3.workspace = true

# T-009 version pins (SPEC risk: iroh API churn). These move together;
# bump them as one set and re-run the full suite. All MIT OR Apache-2.0.
iroh.workspace = true
iroh-mdns-address-lookup = "=0.5.0"
tokio.workspace = true

[dev-dependencies]
anyhow = "1"
ferry-relay = { path = "../ferry-relay" }
# Test fixtures open stores through ferry-folder's test-util helper.
ferry-folder = { path = "../ferry-folder", features = ["test-util"] }
tempfile.workspace = true
rand.workspace = true

[package.metadata.notes]
pins = "iroh 1.0.x family (iroh, iroh-relay, iroh-base, iroh-dns) + iroh-mdns-address-lookup 0.5.x must be bumped together"

[lints]
workspace = true
