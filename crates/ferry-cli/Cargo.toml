[package]
name = "ferry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-crypto = { path = "../ferry-crypto" }
ferry-scan = { path = "../ferry-scan" }
ferry-ignore = { path = "../ferry-ignore" }
ferry-folder.workspace = true
ferry-sync = { path = "../ferry-sync" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
ferry-pin = { path = "../ferry-pin" }
ferry-ipc = { path = "../ferry-ipc" }
ferry-tui = { path = "../ferry-tui", optional = true }
ferry-gui = { path = "../ferry-gui", optional = true }
ferry-daemon = { path = "../ferry-daemon", default-features = false }
ferry-platform.workspace = true
tokio = { workspace = true, features = ["signal"] }
axum = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true
qrcode.workspace = true
subtle.workspace = true

[features]
default = ["web-ui", "tui", "gui"]
web-ui = ["dep:axum", "ferry-daemon/web-ui"]
tui = ["dep:ferry-tui"]
gui = ["dep:ferry-gui"]
lean = []

[dev-dependencies]
tempfile.workspace = true
ferry-folder = { workspace = true, features = ["test-util"] }
ferry-platform = { path = "../ferry-platform" }
axum = { workspace = true }
ferry-tui = { path = "../ferry-tui" }

[lints]
workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"
