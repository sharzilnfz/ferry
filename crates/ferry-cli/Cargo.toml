[package]
name = "ferry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-crypto = { path = "../ferry-crypto" }
ferry-scan = { path = "../ferry-scan" }
ferry-ignore = { path = "../ferry-ignore" }
# One owner for folder bootstrap + the pairing ritual (ticket 08); this
# crate is only a presentation adapter over it.
ferry-folder.workspace = true
# Ferry engine: daemon and sync commands run SyncEngine directly (T-14).
ferry-sync = { path = "../ferry-sync" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
# Session pinning: the exchange loop consults the hold filter pre-apply and
# `ferry pin` drives start/stop/release/status on top of its ledgers.
ferry-pin = { path = "../ferry-pin" }
ferry-ipc = { path = "../ferry-ipc" }
ferry-tui = { path = "../ferry-tui" }
ferry-daemon = { path = "../ferry-daemon" }
ferry-platform.workspace = true
tokio = { workspace = true, features = ["signal"] }
axum.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true
# Terminal QR rendering only (ASCII art over the matrix). All pairing and
# key-handling crypto lives behind ferry-crypto (T-03).
qrcode.workspace = true
subtle.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"
