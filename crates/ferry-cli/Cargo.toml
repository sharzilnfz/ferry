[package]
name = "ferry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-store = { path = "../ferry-store" }
ferry-crypto = { path = "../ferry-crypto" }
ferry-scan = { path = "../ferry-scan" }
ferry-ignore = { path = "../ferry-ignore" }
# The M0 crate supplies two reusable seams this CLI drives directly:
# `proto` (HELLO/OFFER/REQ_META/REQ_DATA/ITEM message codecs) and
# `transport` (the Transport/Listener/Connection trait + TcpTransport).
# T-009/T-014 swap the implementation under these same seams.
ferry-sync = { path = "../ferry-sync" }
ferry-sync-engine = { path = "../ferry-sync-engine" }
# Session pinning: the exchange loop consults the hold filter pre-apply and
# `ferry pin` drives start/stop/release/status on top of its ledgers.
ferry-pin = { path = "../ferry-pin" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
rand.workspace = true
thiserror.workspace = true
# Pair-grant sealing only (offer/accept file channel); the store cipher
# comes from ferry-crypto::pack_cipher.
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
qrcode.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"
