[package]
name = "ferry-ignore"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferry-scan = { path = "../ferry-scan" }
# BurntSushi's `ignore` crate: dual MIT/Apache-2.0, compatible with this
# workspace (MIT). We use ONLY `gitignore::Gitignore` (pattern compilation +
# single-file matching); its directory walker is deliberately NOT used —
# ferry-scan owns walking. Rationale recorded in lib.rs and the ticket.
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
ferry-store = { path = "../ferry-store" }
tempfile = "3"
